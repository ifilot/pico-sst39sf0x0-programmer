name: build

on:
  push:
    branches: [ "master", "develop" ]
    tags:
    - 'v*'
  pull_request:
    branches: [ "master", "develop" ]

env:
  BUILD_TYPE: Release
  PROGNAME: pico-sst39sf0x0-programmer
  FIRMWARE: pico-sst39sf0x0-programmer-firmware
  FIRMWARE2: pico2-sst39sf0x0-programmer-firmware
  EXEC: pico-sst39sf0x0-programmer.exe

jobs:
  #
  # (optional) Create release
  #
  create-release:
    runs-on: ubuntu-latest
    permissions: write-all
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}

  # ==========================================================
  # Windows build + installer (MSYS2 MinGW64)
  # ==========================================================
  windows-mingw:
    name: Windows Installer
    runs-on: windows-latest
    permissions:
      contents: write

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # MSYS2 + MinGW toolchain
      # --------------------------------------------------------
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-qt6-serialport
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-eigen3
            mingw-w64-x86_64-glm
            mingw-w64-x86_64-mesa
            mingw-w64-x86_64-nsis

      # --------------------------------------------------------
      # Debug: ensure windeployqt exists
      # --------------------------------------------------------
      - name: List Qt deploy tools
        run: |
          ls /mingw64/bin/windeployqt*

      # --------------------------------------------------------
      # Configure, build, and test
      # --------------------------------------------------------
      - name: Configure (Windows)
        run: |
          cmake -S gui -B build-windows -G Ninja \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DCMAKE_PREFIX_PATH=/mingw64

      - name: Build (Windows)
        run: |
          cmake --build build-windows --parallel

      - name: Test (Windows)
        run: |
          ctest --test-dir build-windows --build-config ${BUILD_TYPE} --output-on-failure

      # --------------------------------------------------------
      # Package
      # --------------------------------------------------------
      - name: Package (Windows)
        run: |
          chmod +x ./package-windows.sh
          BUILD_DIR=build-windows ./package-windows.sh

      # --------------------------------------------------------
      # Always keep installer as artifact
      # --------------------------------------------------------
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            *.exe

      # ========================================================
      # 🚀 Create GitHub Release and upload installer
      # ========================================================
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
            files: |
              *.exe
            generate_release_notes: false

  #
  # Ubuntu
  #
  build-gui-ubuntu:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install packages
      run: sudo apt update && sudo apt install -y qt6-base-dev cmake libqt6serialport6-dev qt6-tools-dev-tools
    - name: Configure CMake
      run: mkdir ${{github.workspace}}/build && cd ${{github.workspace}}/build && cmake ../gui
    - name: Build
      run: cd ${{github.workspace}}/build && make -j
    - name: Test
      run: cd ${{github.workspace}}/build && ctest --output-on-failure

  #
  # PICO firmware
  #
  build-firmware:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ifilot/pico:v0.2.0
    steps:
    - uses: actions/checkout@v3
    - name: Compile firmware
      shell: bash
      run: |
        mkdir build && cd build
        cmake ../firmware
        make -j
    - name: Upload firmware .uf2 file
      uses: actions/upload-artifact@v4
      with:
        name: ${{env.FIRMWARE}}.uf2
        path: ./build/${{env.FIRMWARE}}.uf2

  deploy-firmware:
    runs-on: ubuntu-latest
    needs: [build-firmware, create-release]
    permissions: write-all
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{env.FIRMWARE}}.uf2
        path: ./
    - name: Upload Release Asset
      id: upload-release-asset 
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ${{env.FIRMWARE}}.uf2
        asset_name: ${{env.FIRMWARE}}.uf2
        asset_content_type: application/octet-stream


  #
  # PICO2 firmware
  #
  build-firmware-pico2:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ifilot/pico:v0.2.0
    steps:
    - uses: actions/checkout@v3
    - name: Compile firmware
      shell: bash
      run: |
        mkdir build && cd build
        cmake -DPICO_PLATFORM=rp2350-arm-s -DPICO_BOARD=pico2 ../firmware
        make -j
        cp -v ${{env.FIRMWARE}}.uf2 ${{env.FIRMWARE2}}.uf2
    - name: Upload firmware .uf2 file
      uses: actions/upload-artifact@v4
      with:
        name: ${{env.FIRMWARE2}}.uf2
        path: ./build/${{env.FIRMWARE2}}.uf2

  deploy-firmware-pico2:
    runs-on: ubuntu-latest
    needs: [build-firmware-pico2, create-release]
    permissions: write-all
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{env.FIRMWARE2}}.uf2
        path: ./
    - name: Upload Release Asset
      id: upload-release-asset 
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ${{env.FIRMWARE2}}.uf2
        asset_name: ${{env.FIRMWARE2}}.uf2
        asset_content_type: application/octet-stream
